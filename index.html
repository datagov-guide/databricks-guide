<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A beginner-friendly, unofficial guide to Databricks tags, governed tags, domains, subdomains and Pages.">
<title>Databricks Data Organization Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Plan: Databricks-inspired palette: navy glass surfaces, oat text, lava accent. Dashboard shell: sidebar + topbar + glass cards.
   Hero = interactive isometric office. DM Sans + DM Mono. Palette: Navy 900/800, Oat, Lava 600 + chart blue, amber, green. */
:root{
  --bg:#0b2026;--bg2:#1b3139;--panel:rgba(27,49,57,.66);--panel2:rgba(238,237,233,.06);--line:rgba(238,237,233,.15);
  --tx:#f9f7f4;--mut:#a3b4b9;--c1:#ff3621;--c2:#4a9fe3;--c3:#ffab00;--c4:#00a972;--ok:#1fd09a;--bad:#ff8a7a;
  --o1:#ff3621;--o2:#2a7a8c;
  --ft:.30;--fl:.16;--fr:.08;--nodefill:rgba(11,32,38,.92);--shadow:0 12px 44px rgba(0,0,0,.35);
  --disp:"DM Sans",system-ui,sans-serif;--body:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
body.lt{
  --bg:#f9f7f4;--bg2:#eeede9;--panel:rgba(255,255,255,.82);--panel2:rgba(11,32,38,.05);--line:rgba(27,49,57,.18);
  --tx:#0b2026;--mut:#566b72;--c1:#c92a15;--c2:#1b6aa8;--c3:#8f5d00;--c4:#00805a;--ok:#00805a;--bad:#c0301c;
  --o1:#ff3621;--o2:#9cc6d0;
  --ft:.55;--fl:.32;--fr:.2;--nodefill:rgba(255,255,255,.95);--shadow:0 10px 30px rgba(27,49,57,.14);color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--body);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:0;width:520px;height:520px;border-radius:50%;filter:blur(110px);opacity:.28;pointer-events:none}
body:before{background:var(--o1);top:-180px;left:-140px;opacity:.2}
body:after{background:var(--o2);bottom:-200px;right:-140px;opacity:.3}
body.lt:before,body.lt:after{opacity:.16}
h1,h2,h3{font-family:var(--disp);letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,4.4vw,2.6rem);line-height:1.12}
h2{font-size:1.2rem;margin:30px 0 12px}
h3{font-size:1.02rem}
p{margin:0 0 10px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px;border-radius:8px}
.mut{color:var(--mut)}
.ic{flex:none;display:block}
.glass{background:var(--panel);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.07)}
/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);background:var(--panel);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px}
.brand b{font:600 1.02rem var(--disp);display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:.72rem}
.ngrp{font-size:.72rem;color:var(--mut);padding:14px 10px 4px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;color:var(--mut);text-decoration:none;font-weight:600;font-size:.94rem;border:1px solid transparent;transition:.18s}
.nav:hover{color:var(--tx);background:var(--panel2)}
.nav.on{color:var(--tx);background:linear-gradient(90deg,color-mix(in srgb,var(--a,var(--c1)) 22%,transparent),transparent);border-color:color-mix(in srgb,var(--a,var(--c1)) 40%,transparent)}
.nav.on .ic{color:var(--a,var(--c1));filter:drop-shadow(0 0 6px var(--a,var(--c1)))}
.nav .st{margin-left:auto;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:#04121a}
.nav .st.ok{background:var(--ok);border-color:var(--ok)}
.rank{margin-top:auto;padding:14px;font-size:.84rem}
.rank .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.rank b{font-family:var(--disp)}
.fine{font-size:.7rem;color:var(--mut);margin-top:10px;line-height:1.4}
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 22px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.crumbs{font-size:.88rem;color:var(--mut);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--tx)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;cursor:pointer;transition:.18s}
.ib:hover{border-color:var(--c1);box-shadow:0 0 16px color-mix(in srgb,var(--c1) 40%,transparent)}
#menu{display:none}
.xpchip{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2)}
.xpchip .lv{font:700 .82rem var(--disp);color:var(--c3)}
.xpchip .bar{width:84px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.xpchip .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c3));border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xpchip small{color:var(--mut);font-size:.74rem;font-variant-numeric:tabular-nums}
.view{max-width:1120px;margin:0 auto;padding:22px 22px 70px;animation:vin .4s ease both}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* hero + stats */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:18px;padding:26px;align-items:center;overflow:hidden}
.hero .lead{color:var(--mut);font-size:1.05rem;max-width:46ch;margin:12px 0 18px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);font-weight:700;cursor:pointer;transition:.18s;text-decoration:none;color:var(--tx)}
.btn:hover{border-color:var(--c1);transform:translateY(-1px)}
.btn.p{background:linear-gradient(120deg,#c71d0a,#dd2a14);color:#fff;border:0;box-shadow:0 8px 26px color-mix(in srgb,var(--c1) 35%,transparent)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.4);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}
.office{position:relative}
.lab .office{max-width:560px;margin:0 auto}
.office svg{width:100%;height:auto;display:block;overflow:visible}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.sico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a);border:1px solid color-mix(in srgb,var(--a) 40%,transparent)}
.rinfo{padding:16px;margin-top:12px;display:grid;gap:6px}
.rinfo h3{display:flex;align-items:center;gap:8px}
.mono{font-family:var(--mono);font-size:.8rem}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 .78rem var(--mono);padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--a,var(--c1)) 16%,transparent);border:1px solid color-mix(in srgb,var(--a,var(--c1)) 45%,transparent);color:var(--a,var(--c1));margin:2px 4px 2px 0}
.pill.dash{background:none;border-style:dashed;color:var(--mut);border-color:var(--line)}
/* story timeline */
/* missions */
.tag{font:700 .72rem var(--body);padding:3px 9px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
/* module */
.mh{display:flex;gap:16px;align-items:center;padding:20px;flex-wrap:wrap}
.mh .sico{width:58px;height:58px;border-radius:17px}
.mh .t{flex:1;min-width:200px}
.mh .t .lead{color:var(--mut);margin:6px 0 0;max-width:60ch}
.story{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;margin-top:14px}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 1.1rem var(--disp);background:linear-gradient(135deg,var(--c1),var(--c3));color:#fff;box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 28%,transparent)}
.story small{color:var(--c1);font-weight:700}
.story .bub{margin:4px 0 0;min-height:3em}
.kcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.kc{display:flex;perspective:900px;cursor:pointer;animation:rise .5s both;animation-delay:calc(var(--i)*70ms);outline-offset:4px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.kt{flex:1;display:flex;transition:transform .25s;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.ki{flex:1;display:grid;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.2,.8,.2,1)}
.kc.flip .ki{transform:rotateY(180deg)}
.kf,.kb{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:16px 18px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.kf{border-top:3px solid var(--a)}
.kb{transform:rotateY(180deg);background:linear-gradient(160deg,color-mix(in srgb,var(--a) 18%,var(--panel)),var(--panel));font-size:.93rem}
.kf h3{font-size:1.08rem}
.kf small,.kb small{color:var(--a);font-weight:700}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tile{overflow:hidden;transition:.2s}
.tile.open{border-color:var(--a)}
.tile button{display:flex;width:100%;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:14px;cursor:pointer;min-height:56px}
.tile .tn{flex:1;font-weight:700}
.tile .pl{color:var(--a);transition:transform .25s}
.tile.open .pl{transform:rotate(90deg)}
.tile .tb{display:none;padding:0 14px 14px;color:var(--mut);font-size:.93rem}
.tile.open .tb{display:block}
.ex{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--panel2);border:1px dashed var(--line);font-size:.86rem;color:var(--tx)}
.lab{padding:20px}
.lab .hd{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.lab .hd b{font-family:var(--disp)}
.lab .hd .tag{margin-left:auto}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--panel2);border:1px solid var(--line);gap:4px;margin-bottom:12px}
.seg button{border:0;background:none;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;color:var(--mut);min-height:40px}
.seg button.on{background:color-mix(in srgb,var(--c1) 22%,transparent);color:var(--tx);box-shadow:inset 0 0 0 1px var(--c1)}
.rows{display:grid;gap:8px}
.rw{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);transition:.2s}
.rw.hit{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);box-shadow:0 0 20px color-mix(in srgb,var(--ok) 25%,transparent)}
.rw.dim{opacity:.32}
.rw .nm{font:500 .86rem var(--mono);flex:1;min-width:0;overflow-wrap:anywhere}
.rw .ty{color:var(--c1)}
.sm{min-height:36px;padding:0 12px;font-size:.84rem;border-radius:10px}
.msg{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);font-size:.93rem;background:var(--panel2)}
.msg.ok{border-color:var(--ok);color:var(--ok)}
.msg.bad{border-color:var(--bad);color:var(--bad)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.fld input,.fld select{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:inherit;max-width:100%}
.fld option{color:#111}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{min-height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font:500 .84rem var(--mono);display:inline-flex;align-items:center;gap:8px;transition:.18s;color:var(--tx)}
.chip:hover{border-color:var(--c1)}
.chip.sel{border-color:var(--c1);box-shadow:0 0 0 2px color-mix(in srgb,var(--c1) 40%,transparent),0 0 18px color-mix(in srgb,var(--c1) 40%,transparent)}
.chip.placed{opacity:.5;cursor:default}
.shake{animation:shk .35s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cube.drop{animation:drop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.stp{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:.82rem}
.stp.on{color:var(--ok);border-color:var(--ok)}
.pg{border:1px solid var(--ok);border-radius:16px;padding:16px;margin-top:12px;background:color-mix(in srgb,var(--ok) 8%,transparent);animation:rise .5s both}
.stamp{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:.78rem;color:var(--ok);border:1.5px solid var(--ok);padding:3px 10px;border-radius:99px;animation:stp .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stp{from{transform:scale(2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
pre{margin:8px 0;padding:12px 14px;border-radius:12px;background:#06161b;color:#eeede9;overflow-x:auto;font:500 .8rem var(--mono);border:1px solid var(--line)}
details.pb{margin-top:18px;padding:14px 18px}
details.pb summary{cursor:pointer;font-weight:700;font-family:var(--disp);min-height:32px}
details.pb ol{padding-left:20px;margin:10px 0}
.done{display:flex;align-items:center;gap:14px;padding:16px 18px;margin-top:22px;flex-wrap:wrap}
.done .t{flex:1;min-width:200px}
.done.ready{border-color:var(--c4);box-shadow:0 0 30px color-mix(in srgb,var(--c4) 28%,transparent)}
/* architecture */
.arch{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
#asvg{width:100%;height:auto;display:block;max-width:480px;margin:0 auto}
.nd{cursor:pointer;color:var(--a)}
.nd rect{fill:var(--nodefill);stroke:currentColor;stroke-opacity:.55;stroke-width:1.4;transition:.25s}
.nd text{fill:var(--tx);font:700 13.5px var(--body);pointer-events:none}
.nd .s{font:500 10.5px var(--body);fill:var(--mut)}
.nd:hover rect,.nd.on rect{stroke-opacity:1;filter:drop-shadow(0 0 9px currentColor)}
.nd.seen rect{stroke-opacity:.9}
.edge{fill:none;stroke:var(--mut);stroke-width:1.5;stroke-dasharray:5 6;animation:flow 1.1s linear infinite;opacity:.7}
@keyframes flow{to{stroke-dashoffset:-22}}
.elb{fill:var(--mut);font:600 10px var(--body)}
.dp{padding:20px;position:sticky;top:78px}
.dp ul{padding-left:18px;color:var(--mut);margin:8px 0}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--c1),var(--c3));width:0;transition:width .5s}
/* quiz */
.qa{display:grid;gap:10px;margin-top:12px}
.qo{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;min-height:52px;transition:.2s}
.qo:hover{border-color:var(--c1);transform:translateX(3px)}
.qo.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.qo.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,40px);opacity:0;z-index:60;padding:12px 18px;border-radius:14px;transition:.4s cubic-bezier(.2,.8,.2,1);max-width:90vw;font-weight:700;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70}
#ov{display:none}

.meta{font-size:.84rem;color:var(--mut);margin-bottom:6px}
.glance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:14px;overflow:hidden}
.glance>div{padding:18px 20px;border-right:1px solid var(--line)}
.glance>div:last-child{border-right:0}
.glance h3{display:flex;align-items:center;gap:8px;color:var(--a);margin-bottom:6px}
.glance p{margin:0;font-size:.96rem}
.hint{font-size:.8rem;color:var(--mut);font-weight:500;margin-left:8px;font-family:var(--body)}
.todo{margin:-4px 0 10px;color:var(--mut)}
.todo b{color:var(--tx)}
.blks{display:grid;gap:10px}
.blk{display:flex;align-items:center;gap:16px;padding:16px 18px;text-decoration:none;color:inherit;transition:.2s;border-left:4px solid var(--a)}
.blk:hover{transform:translateX(4px);box-shadow:0 12px 34px color-mix(in srgb,var(--a) 22%,transparent),var(--shadow)}
.blk .num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 1.1rem var(--disp);background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a);border:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
.blk .bt{flex:1;min-width:0}
.blk h3{font-size:1.08rem}
.blk p{margin:2px 0 4px;color:var(--mut);font-size:.95rem}
.blk small{color:var(--mut);font-size:.78rem}
.blk .bs{color:var(--ok);flex:none}
.blk.alt .num{border-radius:12px}
.why{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.why>div{padding:18px}
.why h3{margin:12px 0 4px}
.why p{color:var(--mut);margin:0;font-size:.94rem}
.strip{display:flex;align-items:center;gap:16px;padding:14px 18px;margin-top:14px;flex-wrap:wrap}
.strip .t{flex:1;min-width:180px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:.8rem;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.how{padding:16px 18px;margin-top:14px;display:grid;gap:4px}
@media (max-width:700px){.glance,.why{grid-template-columns:1fr}.glance>div{border-right:0;border-bottom:1px solid var(--line)}.glance>div:last-child{border-bottom:0}}

table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-family:var(--disp)}
.tw{overflow-x:auto;border-radius:14px}
.skip{position:absolute;left:12px;top:-60px;z-index:100;padding:10px 16px;border-radius:10px;background:var(--c1);color:#fff;font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.rst{margin-top:8px;font-size:.78rem;color:var(--mut);background:none;border:0;padding:6px 0;cursor:pointer;text-align:left;text-decoration:underline}
.gq{min-height:44px;width:100%;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--tx);font:inherit;margin:6px 0 12px}
.gl{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.gl>div{padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2)}
.gl b{display:block;color:var(--c3)}
.gl span{color:var(--mut);font-size:.93rem}
.src a{display:block;padding:6px 0;color:var(--c2);font-weight:600}
/* office svg */
.cube .ft{fill:currentColor;fill-opacity:var(--ft);stroke:currentColor;stroke-opacity:.85;stroke-width:1;stroke-linejoin:round}
.cube .fl{fill:currentColor;fill-opacity:var(--fl);stroke:currentColor;stroke-opacity:.5;stroke-width:1;stroke-linejoin:round}
.cube .fr{fill:currentColor;fill-opacity:var(--fr);stroke:currentColor;stroke-opacity:.5;stroke-width:1;stroke-linejoin:round}
.cube.floor{color:#7f9aa3}
.cube.floor .ft{fill-opacity:.1}
.cube.floor .fl,.cube.floor .fr{fill-opacity:.07}
.cube.asset{color:var(--tx)}
.cube.hot{animation:hot 1.2s ease-in-out infinite}
@keyframes hot{50%{filter:drop-shadow(0 0 7px currentColor)}}
.room{cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1);color:var(--a)}
.room:hover{transform:translateY(-4px)}
.room.sel{transform:translateY(-8px);filter:drop-shadow(0 0 12px var(--a))}
.lbl rect{fill:var(--nodefill);stroke:var(--a);stroke-width:1.2}
.lbl text{fill:var(--tx);font:700 14px var(--body);text-anchor:middle;pointer-events:none}
.grid{stroke:var(--line);stroke-width:1;fill:none}
.mote{fill:var(--c1);animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px);opacity:.3}}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:50;left:0;top:0;bottom:0;height:auto;width:290px;max-width:86vw;transform:translateX(-105%);transition:transform .3s}
  body.mo .side{transform:none}
  body.mo #ov{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
  #menu{display:grid}
  .hero{grid-template-columns:1fr}
  .arch{grid-template-columns:1fr}
  .dp{position:static}
}
@media (max-width:560px){
  .view{padding:16px 16px 60px}
  .top{padding:10px 14px;gap:8px}
  .xpchip .bar{width:52px}
  .xpchip small{display:none}
  .hero{padding:18px}
  .cols{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* helpers */
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function count(el,to){if(RM){el.textContent=to;return}const s=performance.now();const f=t=>{const k=Math.min(1,(t-s)/700);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
function confetti(){if(RM)return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ff3621','#4a9fe3','#ffab00','#00a972','#eeede9'];const p=Array.from({length:110},()=>({x:innerWidth/2,y:innerHeight*.6,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:Math.random()*6+3,c:cols[Math.random()*5|0],r:Math.random()*6}));let n=0;(function f(){x.clearRect(0,0,c.width,c.height);p.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.vy+=.45;q.r+=.2;x.fillStyle=q.c;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillRect(-q.s/2,-q.s/2,q.s,q.s*.6);x.restore()});if(++n<95)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='rip';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';b.appendChild(s);setTimeout(()=>s.remove(),620)});
const lvl=()=>Math.floor(S.xp/100)+1;
const RANKS=['Newcomer','Explorer','Navigator','Architect','Master'];
const rank=()=>RANKS[Math.min(lvl()-1,RANKS.length-1)];
const rst={armed:0};
function resetProgress(){if(!rst.armed){rst.armed=1;chrome();clearTimeout(rst.t);rst.t=setTimeout(()=>{rst.armed=0;chrome()},4000);return}rst.armed=0;S={xp:0,done:{},lab:{},seen:{},qbest:0,lt:S.lt};save();toast('Progress erased');route()}
function chrome(){
  $('#lvl').textContent='Lv '+lvl();$('#xtx').textContent=S.xp+' XP';$('#xbar').style.width=(S.xp%100)+'%';
  const rk=$('#rk');if(rk){rk.innerHTML='<div class="row"><span>Level '+lvl()+'</span><b>'+rank()+'</b></div><div class="prog"><i style="width:'+(S.xp%100)+'%"></i></div><div class="mut">'+S.xp+' XP · '+(100-S.xp%100)+' to next level</div><button class="rst" id="rst">'+(rst.armed?'Tap again to erase progress':'Reset my progress')+'</button>';$('#rst').onclick=resetProgress}
  ORDER.forEach(id=>{const s=$('#st-'+id);if(s){s.className='st'+(S.done[id]?' ok':'');s.innerHTML=S.done[id]?I('chk',12):''}});
}
function award(id,amt,msg){if(S.done[id])return;S.done[id]=1;const before=lvl();S.xp+=amt;save();chrome();confetti();toast(msg||('Step complete. +'+amt+' XP'));if(lvl()>before)setTimeout(()=>toast('Level up! You are now '+rank()),2700)}
function labDone(id){if(!S.lab[id]){S.lab[id]=1;save();const b=$('#doneBar');if(b)paintDone(id)}}

const TW=30,TH=15,OX=270,OY=78;
const P=(x,y,z)=>[OX+(x-y)*TW,OY+(x+y)*TH-z];
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function cube(gx,gy,sx,sy,z0,h,cls){const z1=z0+h;
  const t=[P(gx,gy,z1),P(gx+sx,gy,z1),P(gx+sx,gy+sy,z1),P(gx,gy+sy,z1)];
  const l=[P(gx,gy+sy,z0),P(gx+sx,gy+sy,z0),P(gx+sx,gy+sy,z1),P(gx,gy+sy,z1)];
  const r=[P(gx+sx,gy,z0),P(gx+sx,gy+sy,z0),P(gx+sx,gy+sy,z1),P(gx+sx,gy,z1)];
  return '<g class="cube '+(cls||'')+'"><polygon class="fr" points="'+pts(r)+'"/><polygon class="fl" points="'+pts(l)+'"/><polygon class="ft" points="'+pts(t)+'"/></g>'}

 {id:'sales',n:'Sales',tag:'Sales',a:C2,gx:.4,gy:4.3,sx:3.2,sy:2.8,h:34,subs:['Pune','Europe'],assets:['pipeline_forecast','orders_daily']},

function Office(host,cfg){
  const st={sel:cfg.sel||null,showSub:!!cfg.showSub,placed:{},last:null,extra:null};
  function render(){
    let s='<svg viewBox="0 0 540 330" role="group" aria-label="Isometric office with four domains">';
    s+=cube(-.6,-.6,8.8,8.3,-8,8,'floor');
    for(let i=0;i<=8;i++){const a=P(-.6+i*1.1,-.6,0),b=P(-.6+i*1.1,7.7,0);s+='<path class="grid" d="M'+a+'L'+b+'"/>'}
    for(let i=0;i<=7;i++){const a=P(-.6,-.6+i*1.19,0),b=P(8.2,-.6+i*1.19,0);s+='<path class="grid" d="M'+a+'L'+b+'"/>'}
    [[60,150],[470,120],[250,40],[380,260],[120,250],[300,300]].forEach((m,i)=>{s+='<circle class="mote" cx="'+m[0]+'" cy="'+m[1]+'" r="'+(2+i%2)+'" style="animation-delay:'+(i*.6)+'s"/>'});
    const rs=ROOMS.slice().sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy));
    rs.forEach(r=>{
      s+='<g class="room'+(st.sel===r.id?' sel':'')+'" data-room="'+r.id+'" style="--a:'+r.a+'" tabindex="0" role="button" aria-label="'+r.n+' domain">';
      s+=cube(r.gx,r.gy,r.sx,r.sy,0,r.h,'');
      if(st.showSub){const list=r.subs.slice();if(st.extra&&st.extra.room===r.id)list.push(st.extra.name);
        list.forEach((nm,i)=>{s+=cube(r.gx+.3+i*.95,r.gy+.35,.8,.8,r.h,12,(st.extra&&st.extra.name===nm&&st.extra.room===r.id)?'hot':'')})}
      const n=st.placed[r.id]||0;
      for(let k=0;k<n;k++){s+=cube(r.gx+.35+(k%4)*.65,r.gy+r.sy-1-Math.floor(k/4)*.65,.5,.5,r.h,5,'asset'+(st.last===r.id&&k===n-1?' drop':''))}
      s+='</g>'});
    rs.forEach(r=>{const c=P(r.gx+r.sx/2,r.gy+r.sy/2,r.h+(st.showSub?30:20));const w=r.n.length*9+26;
      s+='<g class="lbl" data-room="'+r.id+'" style="--a:'+r.a+';cursor:pointer"><rect x="'+(c[0]-w/2)+'" y="'+(c[1]-14)+'" width="'+w+'" height="26" rx="13"/><text x="'+c[0]+'" y="'+(c[1]+4)+'">'+r.n+'</text></g>'});
    host.innerHTML=s+'</svg>'}
  host.addEventListener('click',e=>{const r=e.target.closest('[data-room]');if(r&&cfg.onPick)cfg.onPick(r.dataset.room)});
  host.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const r=e.target.closest('[data-room]');if(r){e.preventDefault();cfg.onPick&&cfg.onPick(r.dataset.room)}}});
  render();
  return {set(o){Object.assign(st,o);render()},st};
}

  '<h2>Who can do what</h2><div class="glass lab"><div class="tw"><table><tr><th>Role</th><th>What they do</th></tr>'+ROLES.map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td></tr>').join('')+'</table></div></div>'+
  '<h2>Common questions <span class="hint">Tap to open</span></h2><div class="tiles" style="grid-template-columns:1fr" id="faq">'+FAQ.map(f=>'<div class="glass tile" style="--a:var(--c4)"><button aria-expanded="false"><span class="tn">'+f[0]+'</span><span class="pl">'+I('go',18)+'</span></button><div class="tb">'+f[1]+'</div></div>').join('')+'</div>'+
  '<h2>Words you will see</h2><div class="glass lab"><input class="gq" id="gq" placeholder="Search words, e.g. domain" aria-label="Search words"><div class="gl" id="gl"></div><div class="msg" id="gn" style="display:none">No matching word. Try a shorter search.</div></div>'+
  '<h2>Good to know</h2><div class="glass how" style="margin-top:0"><span class="mut">Availability changes over time and differs by cloud and account. Pages and some auto-tagging features are marked Beta in the docs, and an account admin may need to enable domains and Discover. If something is missing in your workspace, ask your admin and check the release notes.</span></div>'+
  '<h2>Official documentation</h2><div class="glass lab src">'+DOCS.map(d=>'<a href="'+d[1]+'" target="_blank" rel="noopener">'+d[0]+' (opens docs.databricks.com)</a>').join('')+'</div>';
}
function mountRef(){
  $$('#faq .tile button').forEach(b=>b.onclick=()=>{const t=b.parentNode;const o=t.classList.toggle('open');b.setAttribute('aria-expanded',o)});
  const draw=q=>{const f=GLOSS.filter(g=>(g[0]+' '+g[1]).toLowerCase().includes(q.toLowerCase()));$('#gl').innerHTML=f.map(g=>'<div><b>'+g[0]+'</b><span>'+g[1]+'</span></div>').join('');$('#gn').style.display=f.length?'none':'block'};
  draw('');$('#gq').oninput=e=>draw(e.target.value.trim());
  $('#cp').onclick=()=>{const txt=CHEAT.map(r=>r[0]+': '+r[1]+'. Example: '+r[2]+'. Controlled by: '+r[3]+'. Seen in: '+r[4]+'.').join('\n');const m=$('#cpm');m.style.display='block';
    const ok=()=>msg(m,'ok','Copied. Paste it anywhere.'),fail=()=>msg(m,'bad','Copy was blocked. Select the table and copy it instead.');
    const old=()=>{try{const t=document.createElement('textarea');t.value=txt;t.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(t);t.select();const r=document.execCommand('copy');t.remove();r?ok():fail()}catch(e){fail()}};
    msg(m,'ok','Copying…');
    try{navigator.clipboard.writeText(txt).then(ok,old)}catch(e){old()}};
}
/* router */
function route(to){
  if(typeof mountArch.stop==='function')mountArch.stop();
  let id=to||location.hash.slice(1);if(!META[id])id='home';
  $$('.nav').forEach(a=>a.classList.toggle('on',a.dataset.id===id));
  const m=getM(id);const li=ORDER.indexOf(id);$('#crumbs').innerHTML='Data Organization Guide / <b>'+(id==='home'?'Start here':(li>=0&&li<6?'Step '+(li+1)+': '+m.n:m.n))+'</b>';
  const v=$('#view');v.style.animation='none';void v.offsetWidth;v.style.animation='';
  if(id==='home'){v.innerHTML=viewHome();mountHome()}
  else if(id==='architecture'){v.innerHTML=viewArch();mountArch()}
  else if(id==='quiz'){v.innerHTML=viewQuiz();mountQuiz()}
  else if(id==='reference'){v.innerHTML=viewRef();mountRef()}
  else{v.innerHTML=viewMod(m);wireCommon(m);LABS[id]();}
  document.body.classList.remove('mo');$('#menu').setAttribute('aria-expanded','false');window.scrollTo(0,0);chrome();
}
/* quiz completion bar override */
const _pd=paintDone;
paintDone=function(id){if(id==='quiz'){const b=$('#doneBar');if(!b)return;b.className='';b.innerHTML=S.done.quiz?'<div class="glass done ready"><div class="sico" style="--a:var(--c4)">'+I('chk',22)+'</div><div class="t"><b>Course complete</b><div class="mut" style="font-size:.88rem">Best score '+S.qbest+' of '+QZ.length+'. You earned every badge.</div></div></div>':'';return}_pd(id)};
/* boot */
buildSide();setTheme();
$('#menu').onclick=()=>{document.body.classList.add('mo');$('#menu').setAttribute('aria-expanded','true');const f=$('.nav.on')||$('.nav');if(f)f.focus()};
const closeMenu=()=>{document.body.classList.remove('mo');$('#menu').setAttribute('aria-expanded','false')};
$('#ov').onclick=closeMenu;
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('mo')){closeMenu();$('#menu').focus()}});
$('#theme').onclick=()=>{S.lt=S.lt?0:1;document.body.classList.toggle('lt',!!S.lt);save();setTheme()};
addEventListener('hashchange',()=>route());
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const id=a.getAttribute('href').slice(1);if(!META[id])return;e.preventDefault();
  try{history.replaceState(null,'','#'+id)}catch(x){try{location.hash=id}catch(y){}}
  route(id)});
route();
</script>
</body>
</html>
